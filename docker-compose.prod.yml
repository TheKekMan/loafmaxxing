# Production Docker Compose
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this adds on top of the base compose file:
#   - Nginx reverse proxy (ports 80/443 exposed instead of raw app ports)
#   - Internal network isolation (app services not directly exposed)
#   - Certbot (Let's Encrypt) volume mounts ready for SSL
#   - Named volume for persistent uploads

services:
  backend:
    ports: !reset []       # Remove direct port exposure from base file
    volumes:
      - uploads:/app/uploads
      - data:/app/data
      - ./backend/models:/app/models
    networks:
      - internal
    restart: always

  frontend:
    ports: !reset []       # Remove direct port exposure from base file
    build:
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    networks:
      - internal
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: loafrate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - internal
    depends_on:
      - frontend
      - backend
    restart: always

  certbot:
    image: certbot/certbot:latest
    container_name: loafrate-certbot
    profiles:
      - ssl
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Run manually to issue/renew certs:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot certonly ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  uploads:
  data:

networks:
  internal:
    driver: bridge
